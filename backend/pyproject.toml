[project]
name = "network-dashboard-backend"
version = "0.1.0"
description = "Network Troubleshooting & Security Dashboard - FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
