<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f3f3f3"/>
  <text x="100" y="90" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">Network Troubleshooting &amp; Security Dashboard</text>
  <text x="100" y="130" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#6a7280">Authorized-only diagnostics and service discovery for hosts you own or are explicitly authorized to test.</text>

  <g transform="translate(100,180)">
    <rect x="0" y="0" width="1200" height="220" rx="12" fill="#f7f7f7" stroke="#d7dce2" stroke-width="2"/>
    <text x="26" y="34" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#67707a" letter-spacing="1.5">PORTFOLIO DEMO MODE</text>
    <text x="770" y="34" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#737d88">This demonstration uses simulated monitoring data. No live systems are scanned.</text>

    <rect x="30" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="105" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2d5d90">3</text>
    <text x="105" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">TOTAL HOSTS</text>

    <rect x="220" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="295" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2d8b52">1</text>
    <text x="295" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">OK</text>

    <rect x="410" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="485" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c38b2d">1</text>
    <text x="485" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">WARNING</text>

    <rect x="600" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="675" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c64b4b">1</text>
    <text x="675" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">CRITICAL</text>

    <rect x="790" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="865" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">0</text>
    <text x="865" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">UNKNOWN</text>

    <rect x="980" y="70" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="1055" y="120" text-anchor="middle" font-size="48" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#8d54c7">2</text>
    <text x="1055" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#68727b" letter-spacing="2">OPEN ALERTS</text>
  </g>

  <g transform="translate(100,430)">
    <rect x="0" y="0" width="1200" height="230" rx="12" fill="#f7f7f7" stroke="#d7dce2" stroke-width="2"/>
    <text x="30" y="44" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2a2e34">Monitored hosts</text>
    <line x1="30" y1="68" x2="1170" y2="68" stroke="#d5d9de" stroke-width="2"/>

    <text x="35" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">NAME</text>
    <text x="260" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">ADDRESS</text>
    <text x="470" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">STATUS</text>
    <text x="650" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">LATENCY</text>
    <text x="770" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">OPEN PORTS</text>
    <text x="940" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">ALERTS</text>
    <text x="1020" y="100" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#717b86" letter-spacing="2">LAST CHECKED</text>

    <line x1="30" y1="120" x2="1170" y2="120" stroke="#e1e5ea" stroke-width="1.5"/>

    <text x="35" y="155" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#2f63a7">Production Web Server</text>
    <text x="260" y="155" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">192.168.1.20</text>
    <rect x="470" y="132" width="86" height="28" rx="14" fill="#d8f0dc" stroke="#3f8d61" stroke-width="1.5"/>
    <text x="513" y="151" text-anchor="middle" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0d8d4c">OK</text>
    <text x="650" y="155" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">24.0 ms</text>
    <text x="770" y="155" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">3</text>
    <text x="940" y="155" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">0</text>
    <text x="1020" y="155" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">10/5/2026, 10:30:00 PM</text>
    <rect x="1135" y="130" width="72" height="34" rx="6" fill="#f5f5f5" stroke="#c7ccd2" stroke-width="1.5"/>
    <text x="1171" y="154" text-anchor="middle" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#4c5660">Delete</text>

    <line x1="30" y1="175" x2="1170" y2="175" stroke="#e1e5ea" stroke-width="1.5"/>
    <text x="35" y="210" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#2f63a7">Development Server</text>
    <text x="260" y="210" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">192.168.1.35</text>
    <rect x="470" y="187" width="110" height="28" rx="14" fill="#f6e9c9" stroke="#c49d42" stroke-width="1.5"/>
    <text x="525" y="206" text-anchor="middle" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#a86d1d">WARNING</text>
    <text x="650" y="210" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">142.0 ms</text>
    <text x="770" y="210" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">2</text>
    <text x="940" y="210" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">1</text>
    <text x="1020" y="210" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">10/5/2026, 10:25:00 PM</text>
    <rect x="1135" y="186" width="72" height="34" rx="6" fill="#f5f5f5" stroke="#c7ccd2" stroke-width="1.5"/>
    <text x="1171" y="210" text-anchor="middle" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#4c5660">Delete</text>

    <line x1="30" y1="230" x2="1170" y2="230" stroke="#e1e5ea" stroke-width="1.5"/>
    <text x="35" y="265" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#2f63a7">Database Server</text>
    <text x="260" y="265" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">192.168.1.40</text>
    <rect x="470" y="242" width="108" height="28" rx="14" fill="#f8d9d9" stroke="#c87070" stroke-width="1.5"/>
    <text x="524" y="261" text-anchor="middle" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c24848">CRITICAL</text>
    <text x="650" y="265" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">—</text>
    <text x="770" y="265" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">0</text>
    <text x="940" y="265" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">1</text>
    <text x="1020" y="265" font-size="21" font-family="Segoe UI, Arial, sans-serif" fill="#303840">10/5/2026, 10:20:00 PM</text>
    <rect x="1135" y="242" width="72" height="34" rx="6" fill="#f5f5f5" stroke="#c7ccd2" stroke-width="1.5"/>
    <text x="1171" y="266" text-anchor="middle" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#4c5660">Delete</text>
  </g>
</svg>
