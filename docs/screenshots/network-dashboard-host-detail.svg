<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f3f3f3"/>
  <text x="100" y="90" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">Network Troubleshooting &amp; Security Dashboard</text>
  <text x="100" y="130" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#6a7280">Authorized-only diagnostics and service discovery for hosts you own or are explicitly authorized to test.</text>
  <text x="100" y="170" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#6d7580" letter-spacing="1.5">PORTFOLIO DEMO MODE</text>
  <text x="850" y="170" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#6d7580" letter-spacing="1.5">SIMULATED DIAGNOSTIC RESULTS</text>

  <g transform="translate(100,210)">
    <rect x="0" y="0" width="1200" height="110" rx="12" fill="#f7f7f7" stroke="#d7dce2" stroke-width="2"/>
    <text x="30" y="38" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#69737c" letter-spacing="2">HOST DETAILS</text>
    <text x="30" y="82" font-size="40" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">Production Web Server</text>
    <text x="1080" y="38" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#69737c" letter-spacing="2">OK</text>
    <rect x="1050" y="48" width="90" height="28" rx="14" fill="#d8f0dc" stroke="#3a8b58" stroke-width="1.5"/>
    <text x="1095" y="68" text-anchor="middle" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0d8d4e">OK</text>
    <text x="30" y="106" font-size="28" font-family="Segoe UI, Arial, sans-serif" fill="#303840">192.168.1.20</text>
  </g>

  <g transform="translate(100,345)">
    <rect x="0" y="0" width="1200" height="110" rx="12" fill="#f7f7f7" stroke="#d7dce2" stroke-width="2"/>
    <rect x="30" y="25" width="250" height="60" rx="8" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="155" y="58" text-anchor="middle" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">24 ms</text>
    <text x="155" y="84" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#677179" letter-spacing="2">LATENCY</text>

    <rect x="310" y="25" width="250" height="60" rx="8" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="435" y="58" text-anchor="middle" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">3</text>
    <text x="435" y="84" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#677179" letter-spacing="2">OPEN PORTS</text>

    <rect x="590" y="25" width="250" height="60" rx="8" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="715" y="58" text-anchor="middle" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">0</text>
    <text x="715" y="84" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#677179" letter-spacing="2">OPEN ALERTS</text>

    <rect x="870" y="25" width="250" height="60" rx="8" fill="#f4f4f4" stroke="#d9dde2" stroke-width="2"/>
    <text x="995" y="58" text-anchor="middle" font-size="32" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">Yes</text>
    <text x="995" y="84" text-anchor="middle" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#677179" letter-spacing="2">AUTHORIZED</text>
  </g>

  <g transform="translate(100,485)">
    <rect x="0" y="0" width="1200" height="220" rx="12" fill="#f7f7f7" stroke="#d7dce2" stroke-width="2"/>
    <text x="30" y="42" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2b2d31">Diagnostic Checks</text>
    <line x1="30" y1="60" x2="1170" y2="60" stroke="#dce1e7" stroke-width="1.5"/>

    <text x="30" y="95" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#69737c" letter-spacing="2">CHECK</text>
    <text x="480" y="95" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#69737c" letter-spacing="2">STATUS</text>
    <text x="720" y="95" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#69737c" letter-spacing="2">RESULT</text>

    <line x1="30" y1="110" x2="1170" y2="110" stroke="#dce1e7" stroke-width="1.5"/>
    <text x="30" y="150" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">ICMP Ping</text>
    <text x="480" y="150" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">OK</text>
    <text x="720" y="150" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">24 ms</text>

    <text x="30" y="190" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">DNS Resolution</text>
    <text x="480" y="190" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">OK</text>
    <text x="720" y="190" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">12 ms</text>

    <text x="30" y="230" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">HTTP Health</text>
    <text x="480" y="230" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">OK</text>
    <text x="720" y="230" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">31 ms</text>

    <text x="30" y="270" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">TCP Connectivity</text>
    <text x="480" y="270" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">OK</text>
    <text x="720" y="270" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#2f343b">18 ms</text>
  </g>
</svg>
