    <rect x="1095" y="141" width="82" height="38" rx="8" fill="#f5f5f5" stroke="#c7ccd2" stroke-width="1.5"/>
    <text x="1136" y="167" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#4c5660">Resolve</text>

