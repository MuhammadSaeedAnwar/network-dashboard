services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: ${LOG_JSON:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PING_COUNT: ${PING_COUNT:-3}
      PING_TIMEOUT_SECONDS: ${PING_TIMEOUT_SECONDS:-2}
      PING_LATENCY_WARNING_MS: ${PING_LATENCY_WARNING_MS:-150}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
      TRACEROUTE_TIMEOUT_SECONDS: ${TRACEROUTE_TIMEOUT_SECONDS:-10}
      NMAP_TOP_PORTS: ${NMAP_TOP_PORTS:-100}
      NMAP_TIMEOUT_SECONDS: ${NMAP_TIMEOUT_SECONDS:-180}
      NMAP_MAX_TOP_PORTS: ${NMAP_MAX_TOP_PORTS:-1000}
      ENABLE_PACKET_CAPTURE: ${ENABLE_PACKET_CAPTURE:-false}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
